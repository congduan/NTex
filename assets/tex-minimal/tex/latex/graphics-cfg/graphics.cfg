\ProvidesFile{graphics.cfg}%
  [2026/10/28 v2.0 NTex distribution: fixed pdftex.def]%

% NTex 发行版固定 pdftex.def。
%
% 上游 sample graphics.cfg 按引擎/`\pdfoutput` 探测驱动；NTex 只有一个
% 引擎，且其 PDF 后端消费 pdfTeX 语义（`\pdfximage`/`\pdfrefximage` 走
% ntex-image whatsit → ntex-pdf Image XObject）。图片驱动必须与
% `\pdfoutput` 信号解耦：ctex 文档类为选 Fandol DVI 字体臂会把
% `\pdfoutput` 置 0，若据此回落到 dvips.def，`\includegraphics{img.png}`
% 会转向 `img.xbb` 并报 BoundingBox 错。
%
% 另外 ctex 会往 `\@classoptionslist` 注入 `dvipdfmx`（ctexbackend.cfg），
% 该选项在 graphics.sty 的 `\ProcessOptions` 中晚于本文件执行、会覆盖
% `\Gin@driver`；故这里把各历史驱动选项重声明为空操作，保证本发行版
% 始终载入 pdftex.def。用户源内显式驱动选项同样被忽略。
\def\Gin@driver{pdftex.def}%
\ExecuteOptions{pdftex}%
% 忽略其它图形驱动选项（均为 graphics.sty 已声明的同名选项）。
\DeclareOption{dvips}{}%
\DeclareOption{dvipdf}{}%
\DeclareOption{dvipdfm}{}%
\DeclareOption{dvipdfmx}{}%
\DeclareOption{xdvi}{}%
\DeclareOption{xetex}{}%
\DeclareOption{luatex}{}%
\DeclareOption{dvisvgm}{}%
\DeclareOption{dvipsone}{}%
\DeclareOption{dviwindo}{}%
\DeclareOption{emtex}{}%
\DeclareOption{dviwin}{}%
\DeclareOption{oztex}{}%
\DeclareOption{textures}{}%
\DeclareOption{pctexps}{}%
\DeclareOption{pctexwin}{}%
\DeclareOption{pctexhp}{}%
\DeclareOption{pctex32}{}%
\DeclareOption{truetex}{}%
\DeclareOption{tcidvi}{}%
\DeclareOption{vtex}{}%
\endinput
