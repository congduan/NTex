%% NTex 发行树内置 hyphenation 配置（确定性重建保障）。
%%
%% latex.ltx 末段 `\InputIfFileExists{hyphen.cfg}` 走搜索链：assets/tex-minimal
%% 优先于宿主 TeX Live（ntex-dvi main.rs default_vfs 的 push 顺序）。本文件
%% 在场即可保证 fmt 重建不被宿主 language.dat 打断（其条目常引用宿主不存在的
%% 模式文件，如 dehypht-x-2024-02-28.tex；引擎对缺文件如实报错后，重建即在
%% 此中断——本文件使发行 fmt 的断字配置不再依赖宿主 TeX Live 的安装内容）。
%%
%% 断字模式统一走 hyphen.ltx（US patterns，模式文件已内置于
%% tex/generic/hyphen/hyphen.tex），与 latex.ltx 官方无 hyphen.cfg 时的
%% 回退路径完全一致。
%% 与 Babel 的 US English 回退配置一致，声明当前默认语言供宏包查询。
%% NTex 最小格式只随包提供 US patterns；这里不启用多语言切换。
\def\languagename{english}
\chardef\l@english=0
\input{hyphen.ltx}
\endinput
