name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Render the Transformer paper with NTex (engine self-hosting)
        env:
          # CI runners have no TeX Live/TinyTeX — TFMs come from the in-repo assets
          NTEX_TFM_DIR: ${{ github.workspace }}/assets/tfm
        run: |
          cargo run -q -p ntex-dvi -- samples/transformer-real/transformer-standalone.tex site/public/demo.dvi --input-path samples/transformer-real
          cargo run -q -p ntex-dvi -- samples/transformer-real/transformer-standalone.tex site/public/demo.dvi --input-path samples/transformer-real
          cargo run -q -p ntex-pdf -- site/public/demo.dvi site/public/demo.pdf
          rm site/public/demo.dvi
          cp samples/transformer-real/transformer-standalone.tex site/public/demo.tex
          cp samples/transformer-real/refs.bbl site/public/refs.bbl
          mkdir -p site/public/Figures
          cp samples/transformer-real/Figures/*.png site/public/Figures/

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: 构建 Vue 站点
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
