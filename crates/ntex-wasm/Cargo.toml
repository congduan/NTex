[package]
name = "ntex-wasm"
description = "NTex WASM 骨架（M8-A）：浏览器/Node 内跑引擎核心（plain 子集）→ DVI + log"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# cdylib：wasm 产物（wasm-bindgen CLI 再生成 JS/TS 绑定）；
# rlib：native 单测（cargo test --workspace）能链接本 crate——「内嵌 TFM → 排版 → DVI」
#       全链测试在 native 上跑（与 wasm 同路径，见 README「验证边界」）。
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# wasm-bindgen 只进本 crate（workspace 约定）：ntex-core/layout 等保持无 JS 依赖，
# 以便同一路径继续服务 native 后端与未来的非 Web 嵌入（见 README 三档路线）。
wasm-bindgen = "0.2"
ntex-core.workspace = true
ntex-layout.workspace = true
ntex-font.workspace = true
ntex-io.workspace = true
ntex-dvi.workspace = true
# C 档（LaTeX）：`.fmt` 快照解码。宿主把 fmt 字节经 `set_bundle` 注入，
# 本 crate 用 `ntex_format::load` 还原成 FmtState 交给 `Typesetter::import_state`。
ntex-format.workspace = true
# PDF 导出（Document::pdf_bytes）：DVI → PDF，与 native `ntex-pdf` 同一份代码。
# 该 crate 只依赖 ntex-font（无文件系统强耦合），实测可编译到 wasm32；字体
# 字节在 wasm 下只能经 `set_pfb_font` 注入（见 src/lib.rs 模块文档偏差 5）。
ntex-pdf = { path = "../ntex-pdf", version = "0.1.0" }
# B 档第一刀（实时渲染）：软光栅路径（prims + Pixmap + glyphs 均纯 Rust，
# wasm 兼容）。vello/wgpu web 后端仍另案——default-features = false 把
# feature `vello`（拖 wgpu）关掉，wasm32 体积与宿主要求都不可行。
ntex-backend = { path = "../ntex-backend", version = "0.1.0", default-features = false }

[lints]
workspace = true
