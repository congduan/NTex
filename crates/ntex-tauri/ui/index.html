<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NTex Studio — TeX 实时预览（wasm 渲染）</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">NTex<span>Studio</span><em id="engine-info">wasm 加载中…</em></div>
      <div class="toolbar">
        <label title="渲染分辨率（A4@72dpi ≈ 595×842）">dpi
          <select id="dpi">
            <option value="72">72</option>
            <option value="96" selected>96</option>
            <option value="144">144</option>
            <option value="288">288</option>
          </select>
        </label>
        <label class="chk" title="真字形轮廓：fetch Latin Modern / Fandol Song OTF 注入 wasm 后走软光栅填充（未注入字体回落方框）">
          <input type="checkbox" id="glyphs" checked /> 真字形
        </label>
        <label class="chk" title="UTF-8 输入：源文件可直接写中文（引擎侧预置 \utfinputmode=1，不改动源码文本）。关闭则回到 TeX 的 bytes 逐字节语义">
          <input type="checkbox" id="utf8" checked /> UTF-8 中文
        </label>
        <label class="chk" title="排版调试 overlay：盒边界/glue/断点标记（与 ntex-backend --debug 同口径）">
          <input type="checkbox" id="debug" /> debug overlay
        </label>
        <span class="spacer"></span>
        <span id="status" class="status idle" title="排版状态">●</span>
        <span id="timing"></span>
      </div>
    </header>

    <main>
      <section id="editor-pane">
        <div class="pane-title">
          <span><b id="mode-chip" class="mode plain" title="口径自动判定：源码含 \documentclass/\usepackage/\begin{document} 时走 LaTeX（需启动时 LaTeX 资产就绪）">plain</b>
            <em class="hint">LaTeX 自动走 latex.fmt（\documentclass/article.cls/\section…）· 中文走 Fandol Song</em></span>
          <span class="hint">Cmd/Ctrl+S 立即重排 · 草稿自动保存</span>
        </div>
        <div class="editor-wrap">
          <pre id="gutter" aria-hidden="true">1</pre>
          <div class="editor-stack">
            <pre id="hl" aria-hidden="true"><code id="hlcode"></code></pre>
            <textarea id="editor" spellcheck="false" wrap="off"
              placeholder="输入 TeX 源码，右侧实时预览：plain 子集直接排；写 \documentclass{article}…\begin{document}…\end{document} 即按 LaTeX 排（中文需 UTF-8 开关 + 字体注入成功；失败回落方框）…"></textarea>
          </div>
        </div>
      </section>

      <div id="divider" title="拖动调整分栏"></div>

      <section id="preview-pane">
        <div class="pane-title">
          <span>预览 <b id="page-label" class="page-label">– / –</b>
            <em class="hint">滚轮/捏合缩放 · 拖拽平移</em></span>
          <div class="pane-actions">
            <nav class="zoom">
              <button id="zoom-out" title="缩小（Cmd/Ctrl+−）">−</button>
              <span id="zoom-label" class="zoom-label"
                title="显示缩放倍率：1:1 = 一个位图像素对一个屏幕像素">100%</span>
              <button id="zoom-in" title="放大（Cmd/Ctrl++）">+</button>
              <button id="zoom-fit" title="适配窗口（Cmd/Ctrl+0）">适配</button>
              <button id="zoom-one" title="实际大小 1:1（Cmd/Ctrl+1）">1:1</button>
            </nav>
            <span class="vsep"></span>
            <nav>
              <button id="prev-page" title="上一页">‹</button>
              <button id="next-page" title="下一页">›</button>
            </nav>
            <span class="vsep"></span>
            <nav>
              <button id="export-pdf"
                title="导出 PDF（矢量文字：按 DVI 实际用到的字体按需注入 Type1 PFB；缺字体时提示但不阻断，会产出未嵌入字体的降级 PDF）">PDF ⤓</button>
            </nav>
          </div>
        </div>
        <div id="preview-scroll">
          <div id="preview-stage"><canvas id="preview" width="10" height="10"></canvas></div>
        </div>
        <div id="error-bar" hidden></div>
      </section>
    </main>

    <footer id="log-pane">
      <div class="pane-title">
        <span>log / 转录</span>
        <button id="log-toggle" title="折叠/展开">▾</button>
      </div>
      <pre id="log">（等待编译…）</pre>
    </footer>
  </div>
  <script type="module" src="main.js?v=7"></script>
</body>
</html>
